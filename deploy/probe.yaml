apiVersion: v1
kind: Pod
metadata:
  name: todo-probe
  namespace: todo
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  nodeSelector:
    node-role.kubernetes.io/control-plane: ""
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  containers:
    - name: curl
      image: curlimages/curl:8.17.0
      command: ["sleep", "86400"]
      securityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
        seccompProfile:
          type: RuntimeDefault
